[package]
name = "burrow-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "burrow"
path = "src/main.rs"

[dependencies]
burrow-proto = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
# TLS so an `https://` orchestrator endpoint works at all: `tls-ring` is the
# crypto provider the rest of the workspace uses, and `tls-native-roots` trusts
# the platform's CA store, where an operator's certificate already is.
tonic = { workspace = true, features = ["tls-ring", "tls-native-roots"] }
clap = { workspace = true }
anyhow = { workspace = true }
nix = { workspace = true }
# Only for reading --rule. A matcher has four dimensions and three
# comparators, and any flag grammar that expressed it would be a language
# nobody could read back.
serde_json = { workspace = true }
