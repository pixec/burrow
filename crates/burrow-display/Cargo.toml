[package]
name = "burrow-display"
description = "Burrow's virtio-gpu 2D and virtio-input device, and the display socket protocol between a VMM and burrowd"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Built into each patched VMM as well as into burrowd, so it depends on no VMM
# crate and inherits nothing from the Burrow workspace.
[dependencies]
serde = { version = "1", features = ["derive"] }
libc = "0.2"

[dev-dependencies]
serde_json = "1"
