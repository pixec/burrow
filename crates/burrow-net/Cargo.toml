[package]
name = "burrow-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Only to check that a peer's WireGuard public key really is 32 bytes of
# base64 before it is written into a config, never to produce one.
base64 = { workspace = true }
# IP_TRANSPARENT, so a share can bind the client's public address.
libc = { workspace = true }
# UDP sockets have to set IP_TRANSPARENT before bind; tokio's UdpSocket
# does not expose that order.
socket2 = "0.5"
# A userspace stack for nodes with no nftables (macOS guests under
# Virtualization.framework). Off by default: only such a node needs smoltcp
# and the proxy linked into this crate.
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "socket-tcp", "socket-tcp-pause-synack", "async"], optional = true }
burrow-proxy = { workspace = true, optional = true }

[features]
usernet = ["dep:smoltcp", "dep:burrow-proxy"]

[dev-dependencies]
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
burrow-vmm = { workspace = true }

[[example]]
name = "vz-usernet"
required-features = ["usernet"]
