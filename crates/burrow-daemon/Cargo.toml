[package]
name = "burrow-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "burrowd"
path = "src/main.rs"

[dependencies]
burrow-proto = { workspace = true }
burrow-common = { workspace = true }
burrow-firecracker = { workspace = true }
burrow-net = { workspace = true }
burrow-proxy = { workspace = true }
burrow-store = { workspace = true }
tailcat-rs = { workspace = true }
burrow-kit = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
# TLS for the Access listener, which clients reach directly.
tonic = { workspace = true, features = ["tls-ring"] }
prost = { workspace = true }
tower = { workspace = true }
async-stream = { workspace = true }
hyper-util = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
ruzstd = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
futures = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
tracing-subscriber = { workspace = true }
sysinfo = { workspace = true }
uuid = { workspace = true }
aws-sdk-s3 = { version = "1.155.0", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1.5.1", default-features = false, features = ["rustls-ring"] }
aws-smithy-async = { version = "1.3.1", features = ["rt-tokio"] }
