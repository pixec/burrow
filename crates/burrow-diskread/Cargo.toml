[package]
name = "burrow-diskread"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# ext4-view with inode numbers, link counts and extended attributes, meant for
# upstream, from the fork's `burrow` branch.
ext4-view = { git = "https://github.com/pixec/ext4-view-rs", rev = "de7185299d69628551b912143e5afe4793e5aa69", features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"

[dev-dependencies]
flate2 = { workspace = true }

[[test]]
name = "confined"
harness = false
