# Everything that has to hold on every change: the Rust workspace, and the two
# SDKs, which are separate builds this workspace's tests cannot reach.
name: ci

on:
  push:
  pull_request:

# Read-only by default. Nothing in this workflow publishes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the channel and asks for rustfmt and clippy,
      # so the components are installed by the first cargo invocation rather
      # than by an action here.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-ci-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-ci-cargo-

      - name: Format
        run: cargo fmt --all --check

      # burrow-guest is excluded from default-members (it is Linux-only), but
      # this runner is Linux, so --workspace covers it.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The SDKs carry their own copies of the .proto files, since they are
      # published and cannot reach into this workspace.
      - name: SDK protos are in sync
        run: scripts/sync-protos.sh --check

  # A RustSec advisory against anything in Cargo.lock fails the build.
  # Unmaintained, unsound and yanked crates are reported without failing it.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.23.0

      - name: Audit
        run: cargo audit

  # The Python SDK additionally commits code generated from its proto copies,
  # so there are two ways to drift: the copies, checked above, and the
  # generated modules, checked here.
  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The floor in pyproject.toml, so testing here keeps that floor
          # honest.
          python-version: "3.10"

      # `dev` pins grpcio-tools to the minor that produced the committed _pb,
      # which is what makes the drift check below meaningful.
      - name: Install
        run: pip install -e '.[dev]'

      - name: Test
        run: pytest

      - name: Generated protobuf modules are in sync
        run: python scripts/genproto.py --check

  typescript-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The floor in package.json's engines.
          node-version: "18"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      # ci, not install: the lockfile is authoritative.
      - name: Install
        run: npm ci

      # `npm test` builds first, so this covers the type check too.
      - name: Test
        run: npm test
