# Publishes the container images and the Linux binaries for a tagged release.
#
# Triggered by pushing a version tag:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# A manual run builds and uploads artifacts but publishes nothing, so the whole
# path can be exercised without cutting a release. With `images` set it also
# pushes both images tagged <version>-dev.<short hash> and `dev`, never
# `latest`.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      images:
        description: Push dev images of this commit
        type: boolean
        default: false

# Read-only by default; the two jobs that publish widen it themselves.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Both targets are cross-compiled from the x86 runner with cargo-zigbuild,
  # which is what the docs use locally too. The C dependencies
  # (rusqlite's bundled sqlite, ring, userfaultfd) need a musl toolchain for
  # the *target*, which plain musl-tools only provides for the host.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            docker_arch: amd64
            target: x86_64-unknown-linux-musl
            windows_target: x86_64-pc-windows-gnullvm
          - arch: aarch64
            docker_arch: arm64
            target: aarch64-unknown-linux-musl
            windows_target: aarch64-pc-windows-gnullvm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        # A tag is authoritative; a manual run has none, so it falls back to the
        # workspace version and a short sha, which cannot be mistaken for a
        # release.
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            echo "version=${crate}-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      # Both pinned: an unpinned zig is a new C toolchain under the release
      # binaries on whatever day it ships. Deliberately below zig 0.15, which
      # needs clang 18+ for bindgen, and userfaultfd-sys pulls bindgen in.
      - name: Install cross toolchain
        run: |
          set -eu
          python3 -m pip install ziglang==0.13.0
          command -v cargo-zigbuild >/dev/null || \
            cargo install cargo-zigbuild --locked --version 0.19.8
          rustup target add ${{ matrix.target }} ${{ matrix.windows_target }}

      # The tag is the version, so the binaries report it too: `burrow
      # --version` on a v0.2.0 download must not say 0.1.0 because nobody
      # edited Cargo.toml. Every crate inherits `workspace.package.version`,
      # and the build below is not `--locked`, so cargo refreshes the
      # lockfile's own entries. The change is not committed back.
      - name: Set crate versions from the tag
        if: github.ref_type == 'tag'
        run: |
          set -eu
          v='${{ steps.version.outputs.version }}'
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag ${GITHUB_REF_NAME} is not a version" >&2; exit 1 ;;
          esac
          sed -i "0,/^version = \"[^\"]*\"/s//version = \"$v\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml

      # Same invocation as the development harness docs, minus `rustup target add`,
      # which the step above already did.
      # burrow-guest is the guest init rather than a host binary, but the node
      # copies it into every template it builds, so it is built too.
      - name: Build
        run: |
          cargo zigbuild --release --target ${{ matrix.target }} \
            -p burrow-orchestrator -p burrow-daemon -p burrow-cli -p burrow-guest
          cargo zigbuild --release --target ${{ matrix.windows_target }} -p burrow-guest

      # Two layouts of the same binaries: dist/<docker-arch>/ is what the
      # Dockerfiles COPY from, and release/ is what people download. The
      # Windows agent goes to nodes, which upgrade Windows guests to it.
      - name: Stage
        run: |
          set -eu
          out=target/${{ matrix.target }}/release
          mkdir -p dist/${{ matrix.docker_arch }} release
          for bin in burrow-orchestrator burrowd burrow burrow-guest; do
            cp "$out/$bin" "dist/${{ matrix.docker_arch }}/$bin"
            cp "$out/$bin" "release/$bin-${{ matrix.arch }}-${{ steps.version.outputs.version }}"
          done
          exe=target/${{ matrix.windows_target }}/release/burrow-guest.exe
          cp "$exe" "dist/${{ matrix.docker_arch }}/burrow-guest.exe"
          cp "$exe" "release/burrow-guest-windows-${{ matrix.arch }}-${{ steps.version.outputs.version }}.exe"
          cd release && sha256sum * > "SHA256SUMS-${{ matrix.arch }}-${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.docker_arch }}
          path: dist/${{ matrix.docker_arch }}/
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: release/

  # One buildx invocation per image covering both architectures. The binaries
  # are prebuilt, but the RUN steps (apt, the firecracker download) execute
  # under the target platform, so arm64 needs emulation on this runner.
  images:
    needs: build
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.images)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # buildx signs the provenance and SBOM attestations it pushes alongside
      # each image with an OIDC token from this.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-amd64
          path: dist/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-arm64
          path: dist/arm64

      - name: Restore executable bits
        # Artifact upload does not preserve them, and a COPY of a non-executable
        # binary produces an image that fails at ENTRYPOINT rather than at build.
        run: chmod +x dist/*/*

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            echo "version=${crate}-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Orchestrator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # mode=max records the build's own inputs, not just its result, so a
          # published image traces back to this run and this commit.
          provenance: mode=max
          sbom: true
          context: .
          file: deploy/orchestrator.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-orchestrator:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}-orchestrator:${{ steps.version.outputs.channel }}

      - name: Node image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # mode=max records the build's own inputs, not just its result, so a
          # published image traces back to this run and this commit.
          provenance: mode=max
          sbom: true
          context: .
          file: deploy/node.Dockerfile
          # The harness builds `dev` from the same file; be explicit rather
          # than relying on release happening to be the last stage.
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-node:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}-node:${{ steps.version.outputs.channel }}

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signing the provenance below: the OIDC token identifies this workflow
      # to the attestation store.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      # Over the same files the release step uploads, SHA256SUMS included, so
      # what `gh attestation verify` checks is exactly what was fetched.
      - name: Attest the release binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release/*
          generate_release_notes: true
