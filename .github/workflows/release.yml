# Publishes the container images and the Linux binaries for a tagged release.
#
# Triggered by pushing a version tag:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# A manual run builds and uploads artifacts but publishes nothing, so the whole
# path can be exercised without cutting a release.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Read-only by default; the two jobs that publish widen it themselves.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Both targets are cross-compiled from the x86 runner with cargo-zigbuild,
  # which is what `cargo xtask build` already uses locally. The C dependencies
  # (rusqlite's bundled sqlite, ring, userfaultfd) need a musl toolchain for
  # the *target*, which plain musl-tools only provides for the host.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            docker_arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            docker_arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version
        id: version
        # A tag is authoritative; a manual run has none, so it falls back to the
        # workspace version and a short sha, which cannot be mistaken for a
        # release.
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            echo "version=${crate}-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      # Both pinned: an unpinned zig is a new C toolchain under the release
      # binaries on whatever day it ships. Deliberately below zig 0.15, which
      # needs clang 18+ for bindgen, and userfaultfd-sys pulls bindgen in.
      - name: Install cross toolchain
        run: |
          set -eu
          python3 -m pip install ziglang==0.13.0
          command -v cargo-zigbuild >/dev/null || \
            cargo install cargo-zigbuild --locked --version 0.19.8
          rustup target add ${{ matrix.target }}

      # The tag is the version, so the binaries report it too: `burrow
      # --version` on a v0.2.0 download must not say 0.1.0 because nobody
      # edited Cargo.toml. Every crate inherits `workspace.package.version`,
      # and the build below is not `--locked`, so cargo refreshes the
      # lockfile's own entries. The change is not committed back.
      - name: Set crate versions from the tag
        if: github.ref_type == 'tag'
        run: |
          set -eu
          v='${{ steps.version.outputs.version }}'
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag ${GITHUB_REF_NAME} is not a version" >&2; exit 1 ;;
          esac
          sed -i "0,/^version = \"[^\"]*\"/s//version = \"$v\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml

      # Same invocation `cargo xtask build` wraps, spelled out here: the wrapper
      # only adds `rustup target add`, which the step above already did.
      # burrow-agent is the guest init rather than a host binary, but the node
      # copies it into every template it builds, so it is built too.
      - name: Build
        run: |
          cargo zigbuild --release --target ${{ matrix.target }} \
            -p burrow-orchestrator -p burrow-daemon -p burrow-cli -p burrow-agent

      # Two layouts of the same four binaries: dist/<docker-arch>/ is what the
      # Dockerfiles COPY from, and release/ is what people download.
      - name: Stage
        run: |
          set -eu
          out=target/${{ matrix.target }}/release
          mkdir -p dist/${{ matrix.docker_arch }} release
          for bin in burrow-orchestrator burrowd burrow burrow-agent; do
            cp "$out/$bin" "dist/${{ matrix.docker_arch }}/$bin"
            cp "$out/$bin" "release/$bin-${{ matrix.arch }}-${{ steps.version.outputs.version }}"
          done
          cd release && sha256sum * > "SHA256SUMS-${{ matrix.arch }}-${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.docker_arch }}
          path: dist/${{ matrix.docker_arch }}/
          retention-days: 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.arch }}
          path: release/

  # One buildx invocation per image covering both architectures. The binaries
  # are prebuilt, but the RUN steps (apt, the firecracker download) execute
  # under the target platform, so arm64 needs emulation on this runner.
  images:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # buildx signs the provenance and SBOM attestations it pushes alongside
      # each image with an OIDC token from this.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-amd64
          path: dist/amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-arm64
          path: dist/arm64

      - name: Restore executable bits
        # Artifact upload does not preserve them, and a COPY of a non-executable
        # binary produces an image that fails at ENTRYPOINT rather than at build.
        run: chmod +x dist/*/*

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Orchestrator image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # mode=max records the build's own inputs, not just its result, so a
          # published image traces back to this run and this commit.
          provenance: mode=max
          sbom: true
          context: .
          file: deploy/orchestrator.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-orchestrator:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}-orchestrator:latest

      - name: Node image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # mode=max records the build's own inputs, not just its result, so a
          # published image traces back to this run and this commit.
          provenance: mode=max
          sbom: true
          context: .
          file: deploy/node.Dockerfile
          # The harness builds `dev` from the same file; be explicit rather
          # than relying on release happening to be the last stage.
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-node:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}-node:latest

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signing the provenance below: the OIDC token identifies this workflow
      # to the attestation store.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      # Over the same files the release step uploads, SHA256SUMS included, so
      # what `gh attestation verify` checks is exactly what was fetched.
      - name: Attest the release binaries
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/*

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          generate_release_notes: true
