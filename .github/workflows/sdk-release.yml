# Publishes the Python and TypeScript SDKs.
#
# A version tag publishes a release, on the same tag as release.yml:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match the version in sdk/python/pyproject.toml and
# sdk/typescript/package.json.
#
# A manual run with `dev` set publishes a prerelease of the commit it runs on:
# npm gets <version>-dev.<UTC minute>.g<short hash> under the `next` dist-tag,
# and PyPI gets <version>.dev<UTC minute>, since PyPI versions cannot carry a
# hash; its description names the commit. Neither is installed by default. A manual run
# without `dev` builds and tests both packages and publishes nothing.
#
# Both registries use trusted publishing, so no token is stored: PyPI and npm
# each trust this workflow file on this repository.
name: sdk-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dev:
        description: Publish a prerelease of this commit
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
  DEV: ${{ github.event_name == 'workflow_dispatch' && inputs.dev }}

jobs:
  python:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Version matches the tag
        if: env.RELEASE == 'true'
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "pyproject.toml says $version, tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Stamp a dev version
        if: env.DEV == 'true'
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          dev="$version.dev$(date -u +%Y%m%d%H%M)"
          sed -i "s/^version = \"$version\"/version = \"$dev\"/" pyproject.toml
          python - <<EOF
          from pathlib import Path
          readme = Path("README.md")
          title, rest = readme.read_text().split("\n", 1)
          readme.write_text(f"{title}\n\nDevelopment build of commit ${GITHUB_SHA::7}.\n{rest}")
          EOF
          echo "Publishing $dev from ${GITHUB_SHA::7}"

      - name: Test
        run: |
          pip install -e '.[dev]'
          pytest
          python scripts/genproto.py --check

      - name: Build
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: sdk/python/dist/

  python-publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.dev)
    needs: python
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  typescript:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/typescript
    permissions:
      contents: read
      id-token: write
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.dev)) && 'npm' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Version matches the tag
        if: env.RELEASE == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "package.json says $version, tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Stamp a dev version
        if: env.DEV == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          dev="$version-dev.$(date -u +%Y%m%d%H%M).g${GITHUB_SHA::7}"
          npm version "$dev" --no-git-tag-version
          echo "Publishing $dev"

      - name: Test
        run: |
          npm ci
          npm test

      - name: Pack
        run: npm pack --dry-run

      # A version already on the registry is skipped, so a run can be retried.
      - name: Publish
        if: env.RELEASE == 'true' || env.DEV == 'true'
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published"
            exit 0
          fi
          if [ "$DEV" = true ]; then npm publish --tag next; else npm publish; fi
