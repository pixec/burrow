# The namespace. The two cluster tokens are deliberately not here: create the
# Secret yourself, before applying anything else. The manifests that reference
# it stay Pending until you do.
#
# The tokens are distinct on purpose: --api-key is what tenants present to the
# orchestrator; --node-token guards the node-facing hop in both directions. A
# node presents it to register, and the orchestrator presents it on every call
# to a node's own API, which accepts nothing else. A leaked tenant key must
# neither enrol a node nor drive one directly.
#
#   kubectl create namespace burrow
#   kubectl -n burrow create secret generic burrow-tokens \
#     --from-literal=api-key="$(openssl rand -hex 32)" \
#     --from-literal=node-token="$(openssl rand -hex 32)"
apiVersion: v1
kind: Namespace
metadata:
  name: burrow
  labels:
    # Node pods are privileged (see 20-node.yaml). On a cluster enforcing Pod
    # Security Admission, the namespace has to admit them or the DaemonSet is
    # rejected with no pod ever created.
    pod-security.kubernetes.io/enforce: privileged
