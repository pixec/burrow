# Namespace and the two cluster tokens.
#
# The tokens are distinct on purpose: --api-key is what tenants present to the
# orchestrator, --node-token is what a node presents to register. Registration
# decides where exec and logs are routed, so a leaked tenant key must not be
# able to enrol a node.
#
# Replace both values before applying anywhere real:
#   kubectl -n burrow create secret generic burrow-tokens \
#     --from-literal=api-key="$(openssl rand -hex 32)" \
#     --from-literal=node-token="$(openssl rand -hex 32)"
apiVersion: v1
kind: Namespace
metadata:
  name: burrow
  labels:
    # Node pods are privileged (see 20-node.yaml). On a cluster enforcing Pod
    # Security Admission, the namespace has to admit them or the DaemonSet is
    # rejected with no pod ever created.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Secret
metadata:
  name: burrow-tokens
  namespace: burrow
type: Opaque
stringData:
  api-key: CHANGE-ME-tenant-token
  node-token: CHANGE-ME-node-token
