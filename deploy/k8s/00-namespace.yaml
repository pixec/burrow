# The namespace. The two cluster tokens are deliberately not here: create the
# Secret yourself, before applying anything else. The manifests that reference
# it stay Pending until you do.
#
# The tokens are distinct on purpose: --api-key is what tenants present to the
# orchestrator; --node-token guards the node-facing hop in both directions. A
# node presents it to register, and the orchestrator presents it on every call
# to a node's own API, which accepts nothing else. A leaked tenant key must
# neither enrol a node nor drive one directly.
#
#   kubectl create namespace burrow
#   kubectl -n burrow create secret generic burrow-tokens \
#     --from-literal=api-key="$(openssl rand -hex 32)" \
#     --from-literal=node-token="$(openssl rand -hex 32)" \
#     --from-literal=database-url="postgres://burrow:...@postgres:5432/burrow"
#
# database-url names the orchestrator's PostgreSQL. Bring your own: a managed
# instance, or 05-postgres.yaml with CloudNativePG. The orchestrator creates its
# own tables on first start.
#
# Two keys are shared by every orchestrator replica, so they are made once,
# here, rather than by each pod: secrets.key seals stored secrets, and
# access.key (Ed25519, PKCS#8 PEM) signs the Access tokens nodes accept. A
# replica with a key of its own would seal secrets the others cannot open and
# sign tokens that fail on nodes which last heard from another replica.
#
#   head -c 32 /dev/urandom > secrets.key
#   openssl genpkey -algorithm ed25519 -out access.key
#   kubectl -n burrow create secret generic burrow-keys \
#     --from-file=secrets.key --from-file=access.key
#   rm secrets.key access.key
#
# Lose secrets.key and every stored secret is unreadable; keep a copy
# somewhere safe. Replacing access.key only means outstanding Access tokens
# fail until reissued.
apiVersion: v1
kind: Namespace
metadata:
  name: burrow
  labels:
    # Node pods are privileged (see 20-node.yaml). On a cluster enforcing Pod
    # Security Admission, the namespace has to admit them or the DaemonSet is
    # rejected with no pod ever created.
    pod-security.kubernetes.io/enforce: privileged
