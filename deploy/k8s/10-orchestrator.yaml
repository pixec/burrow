# The control plane. One replica: the orchestrator holds the sandbox-to-node
# mapping in a single durable store and has no leader election, so a second
# replica would be a second source of truth rather than failover.
#
# A StatefulSet rather than a Deployment for the volume: its state only covers
# the case nodes cannot (the whole fleet restarting at once, losing the
# mapping), but losing it strands every placement.
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: burrow
spec:
  selector:
    app: burrow-orchestrator
  ports:
    - name: grpc
      port: 7070
      targetPort: 7070
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orchestrator
  namespace: burrow
spec:
  serviceName: orchestrator
  replicas: 1
  selector:
    matchLabels:
      app: burrow-orchestrator
  template:
    metadata:
      labels:
        app: burrow-orchestrator
    spec:
      # The image runs as 65532 (see deploy/orchestrator.Dockerfile). fsGroup
      # makes the PVC group-writable by that uid: a freshly provisioned volume
      # is owned by root, and a non-root process cannot create its database in
      # it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          # Pinned, not :latest: a redeploy should not silently upgrade the
          # one component holding the sandbox-to-node mapping. Set this to the
          # release you mean to run.
          image: ghcr.io/pixec/burrow-orchestrator:0.1.0
          args:
            - --listen
            - 0.0.0.0:7070
            - --data-dir
            - /var/lib/burrow
          env:
            # Tokens by env rather than argv: a token on the command line is
            # visible in `ps` to every process in the container.
            - name: BURROW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: burrow-tokens
                  key: api-key
            - name: BURROW_NODE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: burrow-tokens
                  key: node-token
            - name: RUST_LOG
              value: info
          ports:
            - name: grpc
              containerPort: 7070
          # Requests so the pod is not BestEffort, which is the first thing
          # evicted under memory pressure. The limit is generous against the
          # request: the store grows with the fleet, and a control plane
          # OOMKilled mid-write is worse than one using more than its share.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/burrow
            # readOnlyRootFilesystem leaves nowhere else to write scratch.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
