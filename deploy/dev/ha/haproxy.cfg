# Two orchestrator replicas behind one address, which is what a Kubernetes
# Service gives the nodes and clients. TCP rather than HTTP mode: gRPC is
# HTTP/2 end to end and the replicas terminate it themselves. A replica that
# stops answering its port is taken out within a few seconds, and the next
# connection a node or client makes lands on the other one.
global
    log stdout format raw local0

defaults
    mode tcp
    # A connection that lands on a replica that just died is retried on the
    # other one rather than handed back to the caller as a closed stream.
    option redispatch
    retries 3
    timeout connect 1s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

frontend control_plane
    bind :7070
    default_backend orchestrators

backend orchestrators
    balance roundrobin
    default-server inter 1s fall 2 rise 2
    server a orchestrator:7070 check
    server b orchestrator2:7070 check
