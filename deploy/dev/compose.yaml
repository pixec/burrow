# Local dev harness: orchestrator + two KVM-capable nodes, on the `colima-burrow`
# docker context (a nested-virtualization VM exposing /dev/kvm).
#
# Two nodes rather than one so cross-node behaviour (address-pool
# partitioning, the WireGuard mesh, placement) is actually exercised rather
# than assumed. `docker compose up node` alone still works for single-node
# work.
#
#   cargo xtask build --target aarch64-unknown-linux-musl
#   docker --context colima-burrow compose -f deploy/dev/compose.yaml up
#
# Binaries are bind-mounted from target/, so the loop is: zigbuild + restart.
name: burrow

services:
  # A private registry with basic auth, so the authenticated pull path is
  # exercised rather than assumed. Plain HTTP, which is why nodes are given
  # --insecure-registry for it specifically.
  #
  # The credentials in ./registry/ (burrowtest / s3cret) exist only to make
  # this harness authenticate against itself. They are committed, so treat
  # them as public: never reuse them anywhere, and never point a real registry
  # at this htpasswd file.
  test-registry:
    image: registry:2
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: burrow
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes:
      - ./registry/htpasswd:/auth/htpasswd:ro
    ports:
      # Loopback only: the compose network is what the nodes use, and a
      # published bind would put a registry with committed credentials on
      # every interface of whatever host runs this.
      - "127.0.0.1:5000:5000"

  # Traces only reach here when a daemon is given --otlp-endpoint; both run
  # without it by default.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro

  orchestrator:
    image: debian:bookworm-slim
    command: /burrow/bin/burrow-orchestrator --data-dir /var/lib/burrow --listen 0.0.0.0:7070 --api-key dev-token --node-token dev-node-token --otlp-endpoint http://otel-collector:4317
    ports:
      # Loopback only, like the registry above: the compose network is what
      # the nodes use, and the API key here is the committed `dev-token`.
      - "127.0.0.1:7070:7070"
    # The whole release dir is mounted, not individual binaries: bind-mounting
    # a single file pins its inode, so rebuilt binaries would never appear.
    volumes:
      - ../../target/aarch64-unknown-linux-musl/release:/burrow/bin:ro
      - burrow-orchestrator-data:/var/lib/burrow
    environment:
      RUST_LOG: info

  # The two nodes carry different labels, which is what makes placement
  # affinity testable here: `burrow create --node-label rack=b7` can only land
  # on node2. This is burrow's stand-in for regions: operators label the
  # hardware, and callers constrain placement to labels.
  node:
    build:
      # One Dockerfile for both the harness and the published image, so the
      # firecracker and tooling versions cannot drift apart. Context is the
      # repo root because the release stage copies from dist/ and deploy/.
      context: ../..
      dockerfile: deploy/node.Dockerfile
      target: dev
      args:
        FC_ARCH: aarch64
    command: /burrow/bin/burrowd serve --orchestrator http://orchestrator:7070 --listen 0.0.0.0:7071 --advertise node:7071 --node-id node_local_docker --label rack=a1 --label tier=general --mesh-endpoint node:51820 --api-key dev-token --node-token dev-node-token --otlp-endpoint http://otel-collector:4317 --agent-binary /burrow/bin/burrow-agent --insecure-registry test-registry:5000 --jailer /usr/local/bin/jailer --edge-listen 0.0.0.0:7081 --edge-domain node.sandbox.local
    ports:
      # This node's edge: http://<port>-<sandbox-id>.node.sandbox.local:7081/
      # Opt-in, and off by default. A node without one has no hostname routing,
      # and its published ports are reachable at the node address alone. A real
      # deployment points a wildcard record for the node's domain at the node.
      #
      # Loopback only: this fronts whatever the sandboxes are serving, and a
      # dev harness should not put that on every interface of the host.
      - "127.0.0.1:7081:7081"
    depends_on:
      - orchestrator
    # Firecracker needs KVM; guest NICs need /dev/net/tun; creating taps and
    # programming nftables needs NET_ADMIN; capping sandboxes needs a writable
    # cgroup2 tree, which Docker only grants to a privileged container.
    #
    # This privilege level is an artifact of running a node *inside a
    # container* for local development. A real burrow node is burrowd running
    # as root on the host, where none of this applies. Do not read it as the
    # deployment model.
    privileged: true
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Private namespace so container PIDs and the cgroup tree agree: writing a
    # container-local pid into the host's tree would name a different process.
    cgroup: private
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ../../target/aarch64-unknown-linux-musl/release:/burrow/bin:ro
      # Dev-harness credentials for the local test registry. Not secrets: the
      # registry they open is created by this file too.
      - ./registry/registry-auth.json:/etc/burrow/registry-auth.json:ro
      - burrow-data:/var/lib/burrow
    environment:
      RUST_LOG: info

  node2:
    build:
      # One Dockerfile for both the harness and the published image, so the
      # firecracker and tooling versions cannot drift apart. Context is the
      # repo root because the release stage copies from dist/ and deploy/.
      context: ../..
      dockerfile: deploy/node.Dockerfile
      target: dev
      args:
        FC_ARCH: aarch64
    command: /burrow/bin/burrowd serve --orchestrator http://orchestrator:7070 --listen 0.0.0.0:7071 --advertise node2:7071 --node-id node_local_docker_2 --label rack=b7 --label tier=dedicated --mesh-endpoint node2:51820 --api-key dev-token --node-token dev-node-token --otlp-endpoint http://otel-collector:4317 --agent-binary /burrow/bin/burrow-agent --insecure-registry test-registry:5000 --jailer /usr/local/bin/jailer --edge-listen 0.0.0.0:7081 --edge-domain node2.sandbox.local
    ports:
      # node2's edge, on its own domain: an edge serves only the sandboxes its
      # node holds, so each node needs a wildcard of its own. Loopback only,
      # for the same reason as node's.
      - "127.0.0.1:7082:7081"
    depends_on:
      - orchestrator
    # Firecracker needs KVM; guest NICs need /dev/net/tun; creating taps and
    # programming nftables needs NET_ADMIN; capping sandboxes needs a writable
    # cgroup2 tree, which Docker only grants to a privileged container.
    #
    # This privilege level is an artifact of running a node *inside a
    # container* for local development. A real burrow node is burrowd running
    # as root on the host, where none of this applies. Do not read it as the
    # deployment model.
    privileged: true
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Private namespace so container PIDs and the cgroup tree agree: writing a
    # container-local pid into the host's tree would name a different process.
    cgroup: private
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ../../target/aarch64-unknown-linux-musl/release:/burrow/bin:ro
      - ./registry/registry-auth.json:/etc/burrow/registry-auth.json:ro
      - burrow-data-2:/var/lib/burrow
    environment:
      RUST_LOG: info

volumes:
  burrow-orchestrator-data:
  burrow-data:
  burrow-data-2:
