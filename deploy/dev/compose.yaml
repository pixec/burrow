# Local dev harness: orchestrator + two KVM-capable nodes, on the `colima-burrow`
# docker context (a nested-virtualization VM exposing /dev/kvm).
#
# Two nodes rather than one so cross-node behaviour (address-pool
# partitioning, the WireGuard mesh, placement) is actually exercised rather
# than assumed. `docker compose up node` alone still works for single-node
# work.
#
#   cargo zigbuild --release --target aarch64-unknown-linux-musl \
#     -p burrow-orchestrator -p burrow-daemon -p burrow-cli -p burrow-guest
#   docker --context colima-burrow compose -f deploy/dev/compose.yaml up
#
# Binaries are bind-mounted from target/, so the loop is: zigbuild + restart.
name: burrow

services:
  # A private registry with basic auth, so the authenticated pull path is
  # exercised rather than assumed. Plain HTTP, which is why nodes are given
  # --insecure-registry for it specifically.
  #
  # The credentials in ./registry/ (burrowtest / s3cret) exist only to make
  # this harness authenticate against itself. They are committed, so treat
  # them as public: never reuse them anywhere, and never point a real registry
  # at this htpasswd file.
  test-registry:
    image: registry:2
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: burrow
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes:
      - ./registry/htpasswd:/auth/htpasswd:ro
    ports:
      # Loopback only: the compose network is what the nodes use, and a
      # published bind would put a registry with committed credentials on
      # every interface of whatever host runs this.
      - "127.0.0.1:5000:5000"

  # Traces only reach here when a daemon is given --otlp-endpoint; both run
  # without it by default.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro

  # S3 for the harness, so snapshots can be restored on the node that did not
  # take them. versitygw serves a directory as a bucket store; the nodes
  # create the bucket themselves. The keys are the committed dev ones. 1.0.14
  # ignored If-Match and If-None-Match, which the lease on a stored sandbox
  # needs, so a node refuses to start on it.
  objstore:
    image: versity/versitygw:v1.10.0
    command: ["--port", ":9000", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY_ID: burrow
      ROOT_SECRET_ACCESS_KEY: dev-objstore-secret
    volumes:
      - burrow-objstore-data:/data

  # The orchestrator's store. Placements, tombstones and secrets live here;
  # nodes keep their own SQLite and are the authority on their sandboxes, so
  # this holds only what a whole-fleet restart could not rebuild. The
  # password is the committed dev one and the port is not published.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: burrow
      POSTGRES_PASSWORD: dev-postgres
      POSTGRES_DB: burrow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burrow -d burrow"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - burrow-postgres-data:/var/lib/postgresql/data

  orchestrator:
    image: debian:bookworm-slim
    command: /burrow/bin/burrow-orchestrator --data-dir /var/lib/burrow --listen 0.0.0.0:7070 --api-key dev-token --node-token dev-node-token --otlp-endpoint http://otel-collector:4317 --node-expiry-secs 120
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only, like the registry above: the compose network is what
      # the nodes use, and the API key here is the committed `dev-token`.
      - "127.0.0.1:7070:7070"
    # The whole release dir is mounted, not individual binaries: bind-mounting
    # a single file pins its inode, so rebuilt binaries would never appear.
    volumes:
      - ../../target/aarch64-unknown-linux-musl/release:/burrow/bin:ro
      - burrow-orchestrator-data:/var/lib/burrow
    environment:
      RUST_LOG: info
      # Plain TCP inside the compose network; a real deployment leaves
      # sslmode at its default so TLS is attempted.
      BURROW_DATABASE_URL: postgres://burrow:dev-postgres@postgres:5432/burrow?sslmode=disable

  # The two nodes carry different labels, which is what makes placement
  # affinity testable here: `burrow create --node-label rack=b7` can only land
  # on node2. This is burrow's stand-in for regions: operators label the
  # hardware, and callers constrain placement to labels.
  node:
    build:
      # One Dockerfile for both the harness and the published image, so the
      # firecracker and tooling versions cannot drift apart. Context is the
      # repo root because the release stage copies from dist/ and deploy/.
      context: ../..
      dockerfile: deploy/node.Dockerfile
      target: dev
      args:
        FC_ARCH: aarch64
    # --access-listen is where clients send exec, attach and file traffic,
    # with a token from IssueAccess; the orchestrator carries none of it, so a
    # client has to reach this port. Plaintext here, which the node warns
    # about; a real node serves it over TLS, the tokens being bearer
    # credentials. A CLI on this machine reaches it through the published
    # port once `node` and `node2` resolve here: add
    # `127.0.0.1 node node2` to /etc/hosts.
    command: /burrow/bin/burrowd serve --orchestrator http://orchestrator:7070 --listen 0.0.0.0:7071 --advertise node:7071 --access-listen 0.0.0.0:7073 --access-advertise http://node:7073 --node-id node_local_docker --label rack=a1 --label tier=general --mesh-endpoint node:51820 --api-key dev-token --node-token dev-node-token --otlp-endpoint http://otel-collector:4317 --guest-binary /burrow/bin/burrow-guest --insecure-registry test-registry:5000 --jailer /usr/local/bin/jailer --edge-listen 0.0.0.0:7081 --edge-domain node.sandbox.local --object-store s3://burrow/dev --object-store-endpoint http://objstore:9000 --object-store-key-file /etc/burrow/store.key --hypervisors firecracker,cloud-hypervisor
    ports:
      # This node's edge: http://<port>-<sandbox-id>.node.sandbox.local:7081/
      # Opt-in, and off by default. A node without one has no hostname routing,
      # and its published ports are reachable at the node address alone. A real
      # deployment points a wildcard record for the node's domain at the node.
      #
      # Loopback only: this fronts whatever the sandboxes are serving, and a
      # dev harness should not put that on every interface of the host.
      - "127.0.0.1:7081:7081"
      # Access, loopback only like the edge.
      - "127.0.0.1:7073:7073"
    depends_on:
      - orchestrator
      - objstore
    # Both hypervisors need KVM; guest NICs need /dev/net/tun; creating taps and
    # programming nftables needs NET_ADMIN; capping sandboxes needs a writable
    # cgroup2 tree, which Docker only grants to a privileged container.
    #
    # This privilege level is an artifact of running a node *inside a
    # container* for local development. A real burrow node is burrowd running
    # as root on the host, where none of this applies. Do not read it as the
    # deployment model.
    privileged: true
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Private namespace so container PIDs and the cgroup tree agree: writing a
    # container-local pid into the host's tree would name a different process.
    cgroup: private
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ../../target/aarch64-unknown-linux-musl/release:/burrow/bin:ro
      # Development-harness credentials for the local test registry. Not secrets: the
      # registry they open is created by this file too.
      - ./registry/registry-auth.json:/etc/burrow/registry-auth.json:ro
      # The fleet's store key, sealing brokered credentials a suspended
      # sandbox carries into the object store. Every node mounts the same
      # one. Committed for the harness only, like the registry credentials.
      - ./objstore/store.key:/etc/burrow/store.key:ro
      - burrow-data:/var/lib/burrow
    environment:
      RUST_LOG: info
      AWS_ACCESS_KEY_ID: burrow
      AWS_SECRET_ACCESS_KEY: dev-objstore-secret

  node2:
    build:
      # One Dockerfile for both the harness and the published image, so the
      # firecracker and tooling versions cannot drift apart. Context is the
      # repo root because the release stage copies from dist/ and deploy/.
      context: ../..
      dockerfile: deploy/node.Dockerfile
      target: dev
      args:
        FC_ARCH: aarch64
    command: /burrow/bin/burrowd serve --orchestrator http://orchestrator:7070 --listen 0.0.0.0:7071 --advertise node2:7071 --access-listen 0.0.0.0:7074 --access-advertise http://node2:7074 --node-id node_local_docker_2 --label rack=b7 --label tier=dedicated --mesh-endpoint node2:51820 --api-key dev-token --node-token dev-node-token --otlp-endpoint http://otel-collector:4317 --guest-binary /burrow/bin/burrow-guest --insecure-registry test-registry:5000 --jailer /usr/local/bin/jailer --edge-listen 0.0.0.0:7081 --edge-domain node2.sandbox.local --object-store s3://burrow/dev --object-store-endpoint http://objstore:9000 --object-store-key-file /etc/burrow/store.key --hypervisors firecracker,cloud-hypervisor
    ports:
      # node2's edge, on its own domain: an edge serves only the sandboxes its
      # node holds, so each node needs a wildcard of its own. Loopback only,
      # for the same reason as node's.
      - "127.0.0.1:7082:7081"
      - "127.0.0.1:7074:7074"
    depends_on:
      - orchestrator
      - objstore
    # Both hypervisors need KVM; guest NICs need /dev/net/tun; creating taps and
    # programming nftables needs NET_ADMIN; capping sandboxes needs a writable
    # cgroup2 tree, which Docker only grants to a privileged container.
    #
    # This privilege level is an artifact of running a node *inside a
    # container* for local development. A real burrow node is burrowd running
    # as root on the host, where none of this applies. Do not read it as the
    # deployment model.
    privileged: true
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Private namespace so container PIDs and the cgroup tree agree: writing a
    # container-local pid into the host's tree would name a different process.
    cgroup: private
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ../../target/aarch64-unknown-linux-musl/release:/burrow/bin:ro
      - ./registry/registry-auth.json:/etc/burrow/registry-auth.json:ro
      - ./objstore/store.key:/etc/burrow/store.key:ro
      - burrow-data-2:/var/lib/burrow
    environment:
      RUST_LOG: info
      AWS_ACCESS_KEY_ID: burrow
      AWS_SECRET_ACCESS_KEY: dev-objstore-secret

volumes:
  burrow-objstore-data:
  burrow-postgres-data:
  burrow-orchestrator-data:
  burrow-data:
  burrow-data-2:
