syntax = "proto3";

package burrow.common.v1;

// Lifecycle states of a sandbox. Every transition is persisted and audited.
enum SandboxState {
  SANDBOX_STATE_UNSPECIFIED = 0;
  SANDBOX_STATE_CREATING = 1;
  SANDBOX_STATE_RUNNING = 2;
  // VMM alive, vCPUs paused (in-memory; fastest resume).
  SANDBOX_STATE_PAUSED = 3;
  // Snapshotted to disk, VMM gone; survives daemon restarts.
  SANDBOX_STATE_SUSPENDED = 4;
  SANDBOX_STATE_STOPPING = 5;
  SANDBOX_STATE_DESTROYED = 6;
  SANDBOX_STATE_FAILED = 7;
  // Shut down: VMM gone, writable disk and volumes kept. A start cold-boots
  // the same disk, unlike a resume, which restores the memory of a suspend.
  SANDBOX_STATE_STOPPED = 8;
}

enum NetworkMode {
  NETWORK_MODE_UNSPECIFIED = 0;
  // No egress at all.
  NETWORK_MODE_NONE = 1;
  // Egress only through the proxy, restricted to allow_domains/allow_cidrs.
  NETWORK_MODE_ALLOWLIST = 2;
  // NAT'd egress (still audited at L3/L4).
  NETWORK_MODE_OPEN = 3;
}

// The machine a sandbox runs on. UpdateResources changes it: live where the
// hypervisor can hotplug, otherwise while the sandbox is shut down. A
// suspended sandbox keeps the shape its snapshot was taken of, and so does a
// restore.
message ResourcePolicy {
  uint32 vcpus = 1;
  uint32 mem_mib = 2;
  // The sandbox's own disk, in MiB. On the root layout this is the whole root
  // disk as the guest sees it, at least its template's image; 0 is the image
  // plus 1 GiB. On the overlay layout of older sandboxes it is the scratch
  // disk under the overlay; 0 is 1 GiB.
  uint32 disk_mib = 3;
}

// How long a sandbox stays paid for. All three are read by the same reaper on
// the same pass, and all three can move while the sandbox runs.
message LifetimePolicy {
  // Seconds; 0 = unlimited.
  uint64 max_lifetime_secs = 1;
  // Auto-suspend after this many idle seconds; 0 = never.
  uint64 idle_suspend_secs = 2;
  // A sandbox left suspended this long is deleted by the node's reaper,
  // releasing its disk and its address lease; 0 = keep suspended sandboxes
  // forever. Measured from the moment it entered SUSPENDED, so it composes
  // with idle_suspend_secs: idle parks a sandbox, and this is how long the
  // parked state is worth paying for.
  uint64 suspended_ttl_secs = 3;
}

// How long the snapshots taken of a sandbox stay paid for.
message SnapshotPolicy {
  // Default lifetime of a snapshot taken of this sandbox, in seconds; 0 =
  // never expires. Measured from last use and refreshed whenever a sandbox is
  // created from the snapshot, so an environment people keep starting from
  // stays, and one nobody has touched since it was taken does not.
  uint64 expiration_secs = 1;
  // Keep only the N most recent snapshots of this sandbox, oldest evicted
  // first as a new one is taken. 1..=10; 0 = unlimited.
  uint32 keep_last = 2;
  // Let a snapshot evicted by keep_last live out its expiration
  // instead of being deleted at once. Only meaningful with both of the fields
  // above set, and refused without them: with no expiry an evicted snapshot
  // would be kept forever by a policy whose whole purpose is to bound what is
  // kept.
  //
  // Spelled as "keep" rather than "delete evicted" so the proto3 default, and
  // therefore every caller that says nothing, gets the bounded behaviour.
  bool is_evicted_kept = 3;
}

// Whether callers may run commands in the sandbox.
//
// An absent ExecPolicy allows exec, which is what a sandbox created without one
// has always done. A present one is enforced by the node, before an Exec ever
// reaches the guest agent.
message ExecPolicy {
  bool is_exec_allowed = 1;
}

// What callers may do to the sandbox's filesystem.
//
// An absent FsPolicy allows everything. A present one is enforced by the node
// on upload, download, list_dir and watch, before a path or a byte reaches the
// guest agent.
message FsPolicy {
  bool is_upload_allowed = 1;
  bool is_download_allowed = 2;
  // Absolute path prefixes file operations are confined to, matched on whole
  // path components; empty = whole fs. At most 16, none containing "..".
  repeated string path_scopes = 3;
  // Ceiling on a single upload; 0 = unlimited. An upload that exceeds it is
  // cut off with RESOURCE_EXHAUSTED.
  uint64 max_upload_bytes = 4;
}

// How one string is compared against the part of a request it names.
//
// All three are linear in the length of what they examine: the regex engine on
// the node has no backtracking, so a pattern cannot make a request cost
// unbounded work no matter what the guest sends.
enum StringMatchOp {
  STRING_MATCH_OP_UNSPECIFIED = 0;
  STRING_MATCH_OP_EXACT = 1;
  STRING_MATCH_OP_STARTS_WITH = 2;
  STRING_MATCH_OP_REGEX = 3;
}

message StringMatch {
  StringMatchOp op = 1;
  // At most 256 bytes. A regex that does not compile is refused at the API
  // door, so a rule is never in force in a form the node could not read.
  string value = 2;
}

// One named entry of a request: a query parameter or a header.
message FieldMatch {
  // Query keys are compared case-sensitively, header names case-insensitively,
  // which is what each of the two is defined to mean.
  string key = 1;
  StringMatch value = 2;
}

// Which requests a rule applies to.
//
// A matcher never blocks: it selects which requests the rule's action applies
// to. A request matching no rule is still allowed, it simply leaves unmodified.
// Every dimension given must match; a dimension left out is not examined.
message RequestMatch {
  // Compared against the path alone, without the query string, case-sensitively.
  StringMatch path = 1;
  // Any one of these matching is enough. Compared exactly and case-sensitively,
  // so they are written as "GET", "POST". At most 8.
  repeated string methods = 2;
  // All must match. A request that repeats a key satisfies the entry if any of
  // its values does. At most 8.
  repeated FieldMatch query = 3;
  // All must match, on the same any-value rule. Values are compared
  // case-sensitively. At most 8.
  repeated FieldMatch headers = 4;
}

message HeaderValue {
  // An RFC 9110 token.
  string name = 1;
  // Secret. Never leaves the node: redacted in every response that carries a
  // policy back to a caller.
  string value = 2;
}

// Set these headers on the request before it leaves.
//
// Whatever the client sent under the same name is removed first, so untrusted
// code in the guest can use a credential without ever holding it, and cannot
// send a value of its own that survives.
message SetHeaders {
  repeated HeaderValue headers = 1;
}

// Send the request to an endpoint the operator controls instead of to the
// origin the sandbox named.
message ForwardRequest {
  // An http:// or https:// endpoint, with no query string and no fragment. The
  // forwarded request keeps the original method, headers and body, and its
  // target is this URL's path followed by the original path and query.
  string url = 1;
  // Shared secret sent as `burrow-forwarded-secret`. It proves the request came
  // from a node holding the secret; it says nothing about which sandbox made
  // it. The endpoint must therefore be reachable only by the node. Redacted on
  // every read, like an injected header value.
  string secret = 2;
}

// A rule the proxy applies to inspected requests to one domain.
//
// Rules are evaluated in order and the first whose domain and matcher both
// match wins, so a rule with no matcher shadows every rule after it for that
// domain.
message RequestRule {
  // Domain glob, matched exactly like allow_domains.
  string domain = 1;
  // Absent: every request to the domain.
  RequestMatch match = 2;
  oneof action {
    SetHeaders set_headers = 3;
    ForwardRequest forward = 4;
  }
  // Unix time in milliseconds at which the rule stops applying, or 0 for a
  // rule that never expires. Checked by the proxy on every request against the
  // node's clock, so an expired rule stops applying without a call: no header
  // is set and nothing is forwarded by it, and in open mode its host stops
  // being inspected. The rule stays in the policy until a later update
  // removes it.
  uint64 expires_at_unix_ms = 5;
  reserved 6;
  reserved "is_expired";
  // When set, the rule applies only in the sandbox with this id. A copy of the
  // policy anywhere else, such as a fork or a sandbox created from a
  // snapshot, refuses every request the rule would have claimed rather than
  // send it without its credential. The orchestrator sets it on any rule whose
  // value came from a scoped secret, so a grant cannot travel with a policy to
  // a sandbox the secret was not scoped to.
  string bound_sandbox_id = 7;
}

message NetworkPolicy {
  NetworkMode mode = 1;
  // Domain globs, e.g. "pypi.org", "*.pythonhosted.org".
  repeated string allow_domains = 2;
  repeated string allow_cidrs = 3;
  repeated uint32 allow_ports = 4;
  // Terminate this sandbox's TLS so the host named *inside* the session is
  // checked too, not just the SNI. Closes domain fronting, at the cost of the
  // proxy being able to read the payload, which is why it is opt-in.
  //
  // In allowlist mode every HTTPS connection is inspected. In open mode only
  // connections to the hosts named by `rules` are: they alone are redirected
  // to the proxy and terminated there, and everything else leaves the node
  // exactly as open mode always has, neither proxied nor inspected. Either
  // way the guest is given the fleet's inspection root at creation, which is
  // why this can be turned on only when a sandbox is created; rules can then be
  // added and removed live.
  bool is_tls_inspected = 5;
  // IPv4 or IPv6 ranges this sandbox may never reach, in any mode. Deny beats
  // every allowance: an allowed domain resolving into one of these is refused
  // too. A range applies to its own family only, so an IPv4 list says nothing
  // about IPv6: name the v6 ranges too, or set `is_ipv6_denied`.
  repeated string deny_cidrs = 6;
  // What the host does to requests it inspects: broker a credential onto them,
  // or send them to an endpoint the operator controls. Requires inspect_tls,
  // since the proxy has to terminate TLS to touch a request at all. At most 32.
  // In open mode each rule's domain must be an exact host name, since it also
  // names a host whose TLS is inspected.
  //
  // Field 7 was `repeated HeaderInjection inject_headers`, which is the special
  // case of a rule with no matcher and a set_headers action.
  reserved 7;
  reserved "inject_headers";
  repeated RequestRule rules = 8;
  // Domain globs refused in every mode, before any allowance is consulted. A
  // name matching one is not resolved, not connected to and, inside an
  // inspected session, not requested.
  repeated string deny_domains = 9;
  // Per-request grants and refusals for hosts whose traffic is inspected. A
  // host named only by allow rules here, and not in allow_domains, is bounded:
  // it carries the HTTP requests its rules admit and nothing else, and traffic
  // the proxy cannot inspect is refused. Requires inspect_tls.
  repeated HttpRule http_rules = 10;
  // Ports refused in every mode, ahead of every allowance: a matching
  // connection is dropped by the host firewall whatever `mode`, `allow_cidrs`,
  // `allow_ports` or a peer membership would grant, and refused by the egress
  // proxy on the ports it handles. Applies over IPv4 and IPv6. At most 64.
  repeated PortRule deny_ports = 11;
  // Refuse every IPv6 destination, in every mode. Off by default, which keeps
  // each mode's own IPv6 behaviour: none forwards nothing, allowlist sends
  // TCP 80 and 443 to the egress proxy, open forwards to the public internet.
  // The link to the sandbox's own gateway is unaffected.
  bool is_ipv6_denied = 12;
  // What may reach the sandbox's public addresses from outside: its dedicated
  // IPs and its global IPv6 address. Nothing is admitted unless a rule says
  // so; replies to connections the sandbox opened always are. Published
  // ports, the edge and shares are separate doors and ignore this. At most 64.
  repeated IngressRule ingress = 13;
}

// Transport an ingress rule admits.
enum IngressProtocol {
  // Both TCP and UDP.
  INGRESS_PROTOCOL_UNSPECIFIED = 0;
  INGRESS_PROTOCOL_TCP = 1;
  INGRESS_PROTOCOL_UDP = 2;
  // ICMP echo, and ICMPv6 echo over IPv6. Takes no ports.
  INGRESS_PROTOCOL_ICMP = 3;
}

// A port, or an inclusive range of them.
message PortRange {
  // 1 to 65535.
  uint32 port = 1;
  // Last port, inclusive. 0 means `port` alone.
  uint32 port_end = 2;
}

// One door into a sandbox's public addresses.
message IngressRule {
  IngressProtocol protocol = 1;
  // Destination ports; empty is every port. At most 16.
  repeated PortRange ports = 2;
  // Source CIDRs, IPv4 or IPv6; empty is anyone. A rule naming sources of one
  // family only admits nothing over the other. At most 16.
  repeated string sources = 3;
}

// Transport a port rule applies to.
enum PortProtocol {
  // Both TCP and UDP.
  PORT_PROTOCOL_UNSPECIFIED = 0;
  PORT_PROTOCOL_TCP = 1;
  PORT_PROTOCOL_UDP = 2;
}

// Destination ports, optionally narrowed to destination ranges.
//
// Matches a packet leaving the sandbox when its transport is `protocol`, its
// destination port is in `port`..=`port_end`, and its destination address is
// in one of `cidrs` (empty is every destination).
message PortRule {
  PortProtocol protocol = 1;
  // First port of the range, 1 to 65535.
  uint32 port = 2;
  // Last port of the range, inclusive. 0 means the range is `port` alone;
  // otherwise it is at least `port` and at most 65535.
  uint32 port_end = 3;
  // IPv4 or IPv6 CIDRs, address and prefix, e.g. "10.0.0.0/8" or
  // "2001:db8::/32". A rule naming only one family's ranges leaves the other
  // family's traffic alone. At most 16.
  repeated string cidrs = 4;
}

// One HTTP-level entry of a network policy.
//
// Matches a request when its host matches one of `hosts`, its method one of
// `methods` (empty, or the single entry ANY, is every method) and its path one
// of `paths` (empty is every path). A deny rule refuses matching requests with
// 403, whatever allow rules say; an allow rule admits them on a bounded host.
message HttpRule {
  repeated string hosts = 1;
  repeated string methods = 2;
  // Globs starting with '/': '*' matches within one segment, '**' across
  // segments.
  repeated string paths = 3;
  bool is_denied = 4;
}

// Membership in a named private inter-sandbox network.
message NetworkMembership {
  string network = 1;
  // Ports this member accepts from peers; empty = all.
  repeated uint32 ingress_ports = 2;
  bool is_egress_allowed = 3;
  bool is_ingress_allowed = 4;
  // Name this sandbox answers to on the network, as
  // "<alias>.<network>.internal". Empty means the sandbox id.
  string alias = 5;
}

message Policy {
  ResourcePolicy resources = 1;
  ExecPolicy exec = 2;
  FsPolicy fs = 3;
  NetworkPolicy network = 4;
  repeated NetworkMembership networks = 5;
  // Volumes to attach, in the order the guest should mount them.
  repeated VolumeMount volumes = 6;
  LifetimePolicy lifetime = 7;
  SnapshotPolicy snapshots = 8;
}

// A volume attached to one sandbox at one path.
message VolumeMount {
  string volume = 1;
  // Absolute path in the guest. Checked again inside the guest, since a mount
  // point is a path the host was told rather than one it derived.
  string path = 2;
  // Read-only mounts of one volume can be held by any number of sandboxes at
  // once. A writable mount is exclusive, because the filesystem on a volume is
  // ext4 rather than a cluster filesystem, and two guests writing one image
  // corrupt it.
  bool is_read_only = 3;
  // RAM-backed scratch at `path` instead of a volume: `volume` is empty, the
  // contents live in guest memory and are gone when the VM is.
  bool is_tmpfs = 4;
  // Capacity of a tmpfs mount in MiB; 0 leaves it to the guest's default.
  uint64 size_mib = 5;
  // Octal permissions applied to the mount root when it is created, e.g.
  // "1777". Empty leaves the filesystem's default.
  string mode = 6;
}

// The create-phase inputs a Docker Sandbox Kit template is expanded with.
// The Kits themselves are the template: importing a set records their
// descriptors beside the rootfs, and a create from such a template is
// provisioned the way they ask.
message KitSpec {
  reserved 1;
  reserved "refs";
  // Create-phase arg values by arg name, applied to every Kit declaring it.
  map<string, string> args = 2;
  // Container environment overrides, applied after image defaults and arg
  // exports.
  map<string, string> env = 3;
  // Capability types the host declines for this sandbox, by full type
  // name. A required request of one refuses the create; an optional one is
  // skipped and recorded. A recreation replaces the list wholesale.
  repeated string reject_types = 4;
}

// Storage that outlives the sandboxes that mount it.
//
// Node-local, like a snapshot and for the same reason: it is a disk image on
// one machine, attached to the guest as a virtio block device. A sandbox that
// mounts one is placed on the node holding it.
message Volume {
  string name = 1;
  string node_id = 2;
  uint64 size_mib = 3;
  reserved 4;
  reserved "created_at";
  // Sandbox currently holding the writable claim, empty when free. Read-only
  // mounts are not tracked here: they do not exclude anything.
  string attached_to = 5;
  // Free-form key/value pairs fixed at creation. A Kit volume carries the
  // sandbox it belongs to and the path it mounts at, which is how storage
  // for a path no longer declared stays findable.
  map<string, string> labels = 6;
  int64 created_at_unix_ms = 7;
}

message Sandbox {
  string id = 1;
  string node_id = 2;
  // Guest address, so the orchestrator can tell nodes which remote addresses
  // belong to a shared private network.
  string guest_ip = 8;
  string template = 3;
  SandboxState state = 4;
  Policy policy = 5;
  reserved 6;
  reserved "created_at";
  // Tags, at most 16. Keys are 1..=64 bytes and values up to 256, neither
  // carrying control characters.
  map<string, string> tags = 7;
  // Caller-chosen name, unique across the fleet and fixed for the sandbox's
  // life. Empty when the caller did not ask for one: a name is a convenience,
  // not a second identity, and nothing generates one. Anywhere the API takes a
  // sandbox reference, a name works in place of the id.
  string name = 9;
  // Set by the orchestrator on read paths when the hosting node has missed
  // heartbeats, so a last-known record is not mistaken for a live one. Never
  // persisted and never sent by a node: it describes the node's reachability
  // at the moment of the read, not anything about the sandbox itself.
  bool is_unreachable = 10;
  // Host CPU every VM this sandbox has run has consumed, in microseconds.
  // Read from the sandbox's own cgroup, so it covers the whole VMM (the
  // guest's vCPU threads and Firecracker's own work on their behalf) and
  // accumulates across suspends, resumes and restores. A sandbox that never
  // ran reports 0.
  uint64 cpu_usage_usec = 11;
  // Bytes the sandbox has received and sent on its tap, accumulated the same
  // way. Counted at the tap, which is where the guest's own traffic is: egress
  // that goes through the host proxy is counted as the guest sent it, not
  // again as the proxy forwarded it.
  uint64 rx_bytes = 12;
  uint64 tx_bytes = 13;
  // The VM is running but its guest agent has not answered yet, or never did.
  //
  // A warm create returns as soon as the VM is restored and the firewall is in
  // place, without waiting for the guest, so RUNNING here means "the VM is
  // up", not "something can run inside it". Anything that reaches the guest
  // waits for the agent and fails with a clear error if it never comes, but a
  // caller reading a record in between would otherwise have no way to tell the
  // two apart. Never persisted: it describes the VM currently running, and a
  // sandbox that is resumed handshakes again.
  bool is_agent_unconfirmed = 14;
  // Environment every process in the sandbox starts with, on top of the
  // image's: a Kit's arg exports, credential sentinels and create-time
  // overrides. Empty for a sandbox created without any.
  map<string, string> env = 16;
  // The inputs this sandbox's Kit template was expanded with, when it has
  // one.
  KitSpec kit = 17;
  // Secret values by service for the credentials the composition declares,
  // kept so a boot or a recreation can broker them again. Redacted on every
  // read, like a brokered header's value.
  map<string, string> kit_credentials = 18;
  // The selection a Kit sandbox was created with and the permission surface
  // it was granted, as JSON in the spec library's shape: `{"selection":
  // {"selected": [...], "skipped": [...]}, "surface": {...}}`. Retained
  // across stop and start; a recreation selects afresh.
  string kit_selection = 19;
  // Whether this suspended sandbox's state is in the object store as of its
  // latest suspend, which is what lets it resume on another node.
  bool is_durable = 20;
  // What the saved state needs to be restored on, while it is durable: its
  // cpu architecture and the version of `hypervisor` that wrote it.
  string arch = 21;
  reserved 22, 23;
  reserved "firecracker_version", "access_revoked_at";
  string hypervisor_version = 29;
  // The hypervisor running it, its template's: "firecracker",
  // "cloud-hypervisor" or "vz".
  // Fixed for its life: snapshots, warm pools and moves stay within one.
  string hypervisor = 24;
  // "linux" or "windows", from its template.
  string guest_os = 25;
  // Why the sandbox is in its state when nobody asked for it: set when a
  // node's recovery could not bring it back as it was, and cleared when it
  // next runs.
  string state_reason = 26;
  // SHA-256 of the TLS inspection root this sandbox's guest was told to
  // trust, in hex; empty for a sandbox that is not inspected. It moves,
  // restores and is adopted only onto a node whose root is the same.
  string inspection_root_fingerprint = 27;
  // Unix milliseconds of the last RevokeAccess. Access tokens issued at or
  // before it are refused, wherever the sandbox has moved since.
  int64 access_revoked_at_ms = 28;
  int64 created_at_unix_ms = 30;
  // Dedicated public addresses attached to this sandbox, routed to its tap.
  // Read-only: change them with AttachIp and DetachIp.
  repeated PublicIp public_ips = 31;
  // The sandbox's own global IPv6 address, from its node's routed prefix.
  // Empty on a node given none. Ingress to it follows `NetworkPolicy.ingress`.
  string ipv6_address = 32;
  // The prefix routed to the sandbox around `ipv6_address`, e.g. 64.
  uint32 ipv6_prefix_len = 33;
  // How the guest's filesystem sits on its disks. Fixed for the sandbox's
  // life and carried by its snapshots.
  DiskLayout disk_layout = 34;
}

// How a guest's filesystem sits on its disks.
enum DiskLayout {
  // A record from before the field, which is the overlay layout.
  DISK_LAYOUT_UNSPECIFIED = 0;
  // The template's image read-only under an overlay on a scratch disk, as
  // sandboxes from before root disks keep for life.
  DISK_LAYOUT_OVERLAY = 1;
  // One writable root disk, cloned from the template's image, mounted as /.
  DISK_LAYOUT_ROOT = 2;
}

enum PublicIpState {
  PUBLIC_IP_STATE_UNSPECIFIED = 0;
  // Held by the credential that allocated it.
  PUBLIC_IP_STATE_ALLOCATED = 1;
  // Released and sitting out its quarantine; belongs to nobody.
  PUBLIC_IP_STATE_QUARANTINED = 2;
}

// A dedicated public address: allocated from a pool, attached to at most one
// sandbox, and kept until released. Routed to the sandbox's tap, so the guest
// holds it on its own interface. It reaches one node, so a sandbox holding one
// stays on that node.
message PublicIp {
  string address = 1;
  // 4 or 6.
  uint32 family = 2;
  // Prefix routed to the sandbox: 32 for an IPv4 address, 128 or a subnet such
  // as 64 for IPv6.
  uint32 prefix_len = 3;
  string pool = 4;
  reserved 5, 6, 9;
  reserved "provider", "is_movable", "rdns";
  // Empty while detached.
  string sandbox_id = 7;
  // The node the address reaches, kept once set.
  string node_id = 8;
  int64 allocated_at_unix_ms = 10;
  int64 attached_at_unix_ms = 11;
  // Who allocated it: a digest of the caller's credential.
  string owner = 12;
  // The pool's gateway for this address, its prefix on the uplink, and
  // whether the node answers ARP or NDP for it there.
  string gateway = 13;
  uint32 gateway_prefix_len = 14;
  bool is_on_link = 15;
  bool is_smtp_allowed = 16;
  bool is_wake_on_traffic = 17;
  repeated string nameservers = 18;
  // Set while the address sits out its quarantine after a release.
  int64 released_at_unix_ms = 19;
  int64 quarantined_until_unix_ms = 20;
  PublicIpState state = 21;
}

// Where public addresses come from. Operator configuration.
message IpPool {
  string name = 1;
  // One node, or every node carrying all of `node_labels`.
  string node_id = 2;
  map<string, string> node_labels = 3;
  reserved 4;
  reserved "provider";
  // IPv4: a range "first-last" and/or explicit addresses.
  repeated string ranges = 5;
  repeated string addresses = 6;
  string gateway = 7;
  // The prefix of the network the gateway is on, e.g. 24.
  uint32 prefix_len = 8;
  repeated string nameservers = 9;
  // IPv6: a prefix and the size each sandbox gets from it.
  string prefix6 = 10;
  uint32 per_sandbox = 11;
  // Whether the upstream looks addresses up on the uplink (ARP or NDP), so
  // the node has to answer for them, or routes them to the node.
  bool is_on_link = 12;
  // Outbound TCP 25 from these addresses, blocked unless set.
  bool is_smtp_allowed = 13;
  // Hold the first admitted packet to a suspended holder and resume it.
  bool is_wake_on_traffic = 14;
  // Seconds a released address waits before it is handed out again; 0 is the
  // orchestrator's default.
  int64 quarantine_secs = 15;
  // Read-only counts.
  uint32 total = 16;
  uint32 allocated = 17;
}

// One VM boot inside a sandbox's life.
//
// A sandbox outlives its VMs: a suspend stops one and a resume starts the next,
// and a fork or a create from a snapshot starts one from state written
// somewhere else. A session is the interval between those two events, which is
// what makes "how long has this been running" and "how many times has it come
// back" answerable without inferring them from a state field that only ever
// shows the present.
message Session {
  string id = 1;
  string sandbox_id = 2;
  reserved 3, 4;
  reserved "started_at", "ended_at";
  SessionStart started_by = 5;
  // Unspecified while the session is open.
  SessionEnd ended_by = 6;
  int64 started_at_unix_ms = 7;
  // 0 while the session is open, and for a session the node died during:
  // nothing recorded when that VM actually stopped.
  int64 ended_at_unix_ms = 8;
}

// How a session's VM started.
enum SessionStart {
  SESSION_START_UNSPECIFIED = 0;
  // From a template.
  SESSION_START_BOOT = 1;
  // From a fork or a snapshot.
  SESSION_START_RESTORE = 2;
  // From the sandbox's own suspend state.
  SESSION_START_RESUME = 3;
}

// How a session's VM stopped.
enum SessionEnd {
  SESSION_END_UNSPECIFIED = 0;
  SESSION_END_SUSPENDED = 1;
  SESSION_END_DELETED = 2;
  SESSION_END_FAILED = 3;
  // The session was still open when the node died.
  SESSION_END_UNKNOWN = 4;
  SESSION_END_STOPPED = 5;
}

// A sandbox's saved state, addressable on its own.
//
// Node-local, like a template: a snapshot encodes the host's cpu features and
// the exact Firecracker version, so it can only be restored on the node that
// took it. Unlike a sandbox's own suspend state, it outlives the sandbox it
// came from, which is the point, since many sandboxes can be started from one.
message Snapshot {
  string id = 1;
  // Sandbox the state was taken from. It may since have been deleted.
  string sandbox_id = 2;
  string template = 3;
  // Filled in by the orchestrator from its own view of the fleet; a node knows
  // its snapshots are its own and does not set it.
  string node_id = 4;
  reserved 5, 6, 7, 8, 10, 13;
  reserved "vcpus", "mem_mib", "scratch_disk_mib", "created_at", "expires_at",
      "firecracker_version";
  // Everything the snapshot occupies on the node: memory image, vmstate and
  // disk.
  uint64 size_bytes = 9;
  // A copy of the snapshot is in the fleet's object store, so a create from
  // it can be placed on any compatible node, including when the node that
  // took it is gone. `node_id` is empty when no node holds it locally.
  bool is_durable = 11;
  // What the snapshot was taken on. Guest state only restores on a node of
  // the same architecture running the same hypervisor version, so placement
  // of a durable snapshot is limited to nodes that match.
  string arch = 12;
  // The hypervisor that took it, and the only one that can restore it.
  string hypervisor = 14;
  // The inspection root its guest trusted, when it was inspected. An
  // inspected create from it is placed only on a node with the same root.
  string inspection_root_fingerprint = 15;
  string hypervisor_version = 16;
  // The machine the snapshot was taken on. A restore takes its configuration
  // from the snapshot, so a create from it cannot ask for a different shape.
  ResourcePolicy resources = 17;
  int64 created_at_unix_ms = 18;
  // 0 means the snapshot does not expire.
  int64 expires_at_unix_ms = 19;
  // How its guest's filesystem sits on its disks. A root-layout snapshot
  // restores only on a node naming "root_disk".
  DiskLayout disk_layout = 20;
}

message NodeInfo {
  string id = 1;
  // Address the orchestrator dials for the node API, e.g. "10.0.0.5:7071".
  string address = 2;
  uint32 total_vcpus = 3;
  uint64 total_mem_mib = 4;
  string hostname = 5;
  // Where this node accepts forwarded sandbox traffic, e.g. "10.0.0.5:7072".
  // Separate from the API address because it carries tenant traffic rather
  // than control calls.
  string sandbox_proxy_address = 6;
  // Operator-set facts about where this node is and what it is for, e.g.
  // {"rack": "b7", "tenant": "acme"}. Burrow has no regions; a caller
  // constrains placement by naming labels a node must carry. Held to the same
  // limits as tags, since both are set by an operator and rendered back.
  map<string, string> labels = 7;
  // Domain this node's edge router serves, e.g. "node-a.example.com", and the
  // port it listens on. Empty when the node runs no edge, which is the default
  // and means its published ports have no hostname routing at all. Sandboxes
  // are node-pinned, so a node-scoped hostname is stable for a sandbox's whole
  // life.
  string edge_domain = 8;
  uint32 edge_port = 9;
  // What this node can restore: its cpu architecture, with `hypervisors` and
  // `hypervisor_versions`. A snapshot taken elsewhere is only placed here
  // when all match.
  string arch = 10;
  reserved 11;
  reserved "firecracker_version";
  // Where clients reach this node's Access service directly, scheme
  // included, e.g. "https://node-a.example.com:7073". Empty when it serves
  // none, the default, and then exec and files go through the orchestrator.
  string access_endpoint = 12;
  // Hypervisors this node can run, e.g. ["firecracker", "cloud-hypervisor"].
  // A sandbox is only placed on a node offering the one it asks for.
  repeated string hypervisors = 13;
  // Each offered hypervisor's version, e.g. {"firecracker": "v1.16.1",
  // "cloud-hypervisor": "v54.0"}. Saved state restores only under the version
  // that wrote it, so placement compares against the one the state needs.
  map<string, string> hypervisor_versions = 14;
  // SHA-256 of the root this node's TLS inspection leaves chain to, in hex:
  // the fleet root, or the node's own authority when it has none.
  string inspection_root_fingerprint = 15;
  reserved 16;
  reserved "inspection_ca_expires_at";
  // Policy fields this node enforces beyond the original set, e.g.
  // "deny_ports", "ipv6_denied", "rule_expiry", "rule_binding",
  // "open_inspection". A node that predates a field would drop it silently,
  // so the orchestrator refuses a policy using one on a node not naming it.
  repeated string policy_features = 17;
  // Unix milliseconds when the node's inspection CA expires.
  int64 inspection_ca_expires_at_unix_ms = 18;
  // The routed IPv6 prefix this node gives each sandbox an address from, and
  // the size of each one's share. Empty when it has none.
  string ipv6_prefix = 19;
  uint32 ipv6_per_sandbox = 20;
  reserved 21;
  reserved "ip_providers";
}

message NodeStatus {
  uint32 running_sandboxes = 1;
  uint64 free_mem_mib = 2;
  reserved 3;
  reserved "warm_templates";
  bool is_draining = 4;
  // Templates this node holds. Images are node-local, so placement has to
  // know where they are rather than assuming every node is interchangeable.
  repeated string templates = 5;
  // vCPUs promised to sandboxes on this node, running or suspended. Free
  // memory alone hides a node that is memory-rich and cpu-saturated.
  uint32 committed_vcpus = 6;
  // The subset of `templates` imported from Kits, whose creates the node
  // provisions through the Kit lifecycle.
  repeated string kit_templates = 7;
  // Volumes on this node, including those a Kit's lifecycle created on it,
  // which the orchestrator never saw a request for.
  repeated Volume volumes = 8;
  reserved 9, 10, 11, 12, 13;
  reserved "disk_free_bytes", "disk_total_bytes", "disk_reserve_bytes",
      "disk_unwritten_bytes", "disk_overcommit";
  // Free disk is below the reserve while sandboxes run here. The node refuses
  // creates, resumes and adopts until it is not.
  bool is_disk_low = 14;
  DiskCapacity disk = 15;
  // Warm snapshots ready here, one per template and machine shape. Placement
  // prefers a node holding the shape a create asks for.
  repeated WarmShape warm_shapes = 16;
}

// A warm snapshot of one template at one machine shape. A create of that
// template asking for these vCPUs and this memory restores it instead of
// booting.
message WarmShape {
  string template = 1;
  // The shape it was taken at. A create asking for a bigger root disk than
  // `disk_mib` restores it and grows the disk; one asking for less boots.
  ResourcePolicy resources = 2;
  // Disk its files take on the node.
  uint64 size_bytes = 3;
  // The last create restored from it, or its build.
  int64 last_used_at_unix_ms = 4;
  // Never evicted: the default shape and those the node pre-warms.
  bool is_pinned = 5;
  // The node holding it, filled in by the orchestrator.
  string node_id = 6;
}

// The data directory's filesystem, reported like memory. A total of 0 is a
// node that does not report disk, and placement does not check it.
message DiskCapacity {
  // Free on the filesystem, to the node.
  uint64 free_bytes = 1;
  uint64 total_bytes = 2;
  // What the node keeps free and promises to no sandbox (--disk-reserve-mib,
  // 5% of the filesystem by default).
  uint64 reserve_bytes = 3;
  reserved 4;
  reserved "unwritten_bytes";
  // How far provisioned disk may exceed the filesystem less its reserve
  // (--disk-overcommit). 0, from a node that does not say, means 1.0: never.
  double overcommit = 5;
  // Disk provisioned to sandboxes here: every sandbox's disk at its full size
  // and every volume at its size, however many blocks they share with images
  // or each other, and the blocks the node's warm snapshots take.
  uint64 provisioned_bytes = 6;
}

// What happened to a sandbox.
enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_CREATED = 1;
  EVENT_KIND_STARTED = 2;
  EVENT_KIND_AGENT_READY = 3;
  EVENT_KIND_STOPPED = 4;
  EVENT_KIND_DESTROYED = 5;
  EVENT_KIND_SNAPSHOT_CREATED = 6;
  // A sandbox a node found on restart.
  EVENT_KIND_RECOVERED = 7;
  // A public IP was routed to the sandbox; the detail is the address.
  EVENT_KIND_IP_ATTACHED = 8;
  // A public IP was taken off the sandbox; the detail is the address.
  EVENT_KIND_IP_DETACHED = 9;
}

// One thing that happened to a sandbox, as the node that did it recorded it.
//
// Nodes append events to their own log as they act, and the orchestrator
// tails every node's log into one, so a consumer reads a single ordered
// stream and can resume it from the last `seq` it saw. The usage figures are
// the sandbox's totals at that instant, which is what lets a bill be built
// from the intervals between events.
message Event {
  // The orchestrator's position in the fleet-wide log. 0 on a node's own log.
  uint64 seq = 1;
  string node_id = 2;
  // The node's position in its own log; with `node_id` it names the event
  // exactly once, however many times a tail reconnects.
  uint64 node_seq = 3;
  int64 at_unix_ms = 4;
  string sandbox_id = 5;
  EventKind kind = 6;
  SandboxState state = 7;
  // Why or from what: a session's started_by or ended_by, a snapshot id, a
  // fork's source, or "lost" for a VM a node found gone on restart.
  string detail = 8;
  string template = 9;
  map<string, string> tags = 10;
  uint64 cpu_usage_usec = 11;
  uint64 rx_bytes = 12;
  uint64 tx_bytes = 13;
  uint32 vcpus = 14;
  uint32 mem_mib = 15;
}
