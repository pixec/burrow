syntax = "proto3";

package burrow.guest.v1;

// Served by burrow-guest inside the guest, over vsock; called by burrowd.
service Guest {
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
  // Replaces the running agent with the binary streamed in. The agent
  // verifies the digest, answers, and re-executes itself as PID 1, so the
  // host reconnects and handshakes again. Refused while a command runs.
  rpc Upgrade(stream UpgradeChunk) returns (UpgradeResponse);
  rpc Health(GuestHealthRequest) returns (GuestHealthResponse);
  // Mirrors the public Exec RPC. Deliberately a separate message set from
  // burrow.api.v1 so the guest protocol can version independently of the
  // public API (guests outlive deploys: a paused sandbox resumes with the
  // agent it was snapshotted with).
  rpc Exec(stream ExecInput) returns (stream ExecOutput);

  rpc UploadFile(stream FileChunk) returns (UploadResult);
  rpc DownloadFile(DownloadRequest) returns (stream FileChunk);
  rpc ListDir(ListDirRequest) returns (ListDirResponse);
  rpc Watch(WatchRequest) returns (stream WatchEvent);

  // Commands the agent has run, addressable after the stream that started
  // them is gone.
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);
  rpc GetCommand(GetCommandRequest) returns (CommandInfo);
  // Replays what the command's ring buffer still holds, then follows it live
  // until it exits. Several attachers are supported.
  rpc AttachCommand(AttachCommandRequest) returns (stream ExecOutput);
  // AttachCommand with input and a resume offset. An agent that serves it
  // lists "attach-input" in its health response.
  rpc Attach(stream AttachInput) returns (stream ExecOutput);
  // Every command's output, for the host to keep: the guest holds only what
  // the host has not yet confirmed writing, and resends it after a
  // reconnect. The host opens one at a time; a new one replaces the last. An
  // agent that serves it lists "output-feed" in its health response.
  rpc Feed(stream FeedAck) returns (stream FeedFrame);
  rpc SignalCommand(SignalCommandRequest) returns (SignalCommandResponse);
  // Removes finished commands and their logs, as `docker container prune`
  // does. Running commands are left alone. Nothing else removes a command's
  // log while its sandbox lives.
  rpc PruneCommands(PruneCommandsRequest) returns (PruneCommandsResponse);

  // Users and groups, created with whatever tooling the guest image ships.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc AddUserToGroup(GroupMembership) returns (GroupMembershipResponse);
  rpc RemoveUserFromGroup(GroupMembership) returns (GroupMembershipResponse);
}

message CreateUserRequest {
  string name = 1;
}

message CreateUserResponse {
  string username = 1;
  uint32 uid = 2;
  uint32 gid = 3;
  // Private to the user: 0700, so another sandbox user cannot read it.
  string home = 4;
}

message CreateGroupRequest {
  string name = 1;
}

message CreateGroupResponse {
  string groupname = 1;
  uint32 gid = 2;
  // Group-owned, 2770 setgid, so files created inside stay group-readable.
  string shared_dir = 3;
}

message GroupMembership {
  string user = 1;
  string group = 2;
}

message GroupMembershipResponse {}

message ListCommandsRequest {}

message ListCommandsResponse {
  repeated CommandInfo commands = 1;
}

message GetCommandRequest {
  string command_id = 1;
}

message AttachCommandRequest {
  string command_id = 1;
}

// Follows a command and feeds it, from any stream, not only the one that
// started it: the first message names the command, the rest are its input.
message AttachInput {
  oneof input {
    AttachStart start = 1;
    bytes stdin = 2;
    ExecResize resize = 3;
    int32 signal = 4;
    bool is_stdin_eof = 5;
  }
}

message AttachStart {
  reserved 1;
  string command_id = 2;
  // Output offset to resume from, counting stdout and stderr bytes together
  // from the command's start. An attacher that saw N bytes passes N and gets
  // only what came after; 0 replays everything still held.
  uint64 from_offset = 3;
}

message SignalCommandRequest {
  string command_id = 1;
  int32 signal = 2;
}

message SignalCommandResponse {}

message PruneCommandsRequest {}

message PruneCommandsResponse {
  uint32 removed = 1;
  // Unused since output is kept on the host, which frees its own.
  uint64 freed_bytes = 2;
  // The commands removed, whose logs the host removes in turn.
  repeated string command_ids = 3;
}

// One piece of one command's output, on its way to the host.
message FeedFrame {
  // Orders frames across commands; what an ack names.
  uint64 seq = 1;
  string command_id = 2;
  // Output offset of the frame's first byte, stdout and stderr counted
  // together from the command's start. A jump from the last frame's end is
  // output the guest had to drop before the host took it.
  uint64 at = 3;
  oneof output {
    bytes stdout = 4;
    bytes stderr = 5;
    FeedExit exit = 6;
  }
  // On a command's first frame: how its log rotates, as the exec asked.
  uint64 log_max_bytes = 7;
  uint32 log_max_files = 8;
}

message FeedExit {
  int32 code = 1;
  // The signal that ended the command; 0 if none did.
  int32 signal = 2;
}

// From the host: what it has written. The first message on a feed says where
// each command's log ends, so nothing it already holds is sent again; every
// later one confirms frames up to `seq`, which the guest then lets go of.
message FeedAck {
  uint64 seq = 1;
  repeated FeedPosition positions = 2;
}

message FeedPosition {
  string command_id = 1;
  // Output offset the host's log holds up to.
  uint64 logged = 2;
}

message CommandInfo {
  string command_id = 1;
  repeated string cmd = 2;
  // Empty means the command runs as root.
  string user = 3;
  // "running" or "exited".
  string state = 4;
  // Meaningful only once `state` is "exited".
  int32 exit_code = 5;
  // Unix milliseconds; `ended_at_unix_ms` is 0 while the command runs.
  int64 started_at_unix_ms = 6;
  int64 ended_at_unix_ms = 7;
  // Bytes of output the agent holds for a later attach, in a log on the
  // guest's disk. All of `output_bytes` unless a write to the log failed.
  uint64 buffered_bytes = 8;
  // The signal that ended the command, when one did; 0 otherwise.
  int32 exit_signal = 9;
  // Bytes of output the command has produced in all, stdout and stderr
  // together, which is the offset an attach that is up to date resumes from.
  uint64 output_bytes = 10;
}

message WatchRequest {
  string path = 1;
  bool is_recursive = 2;
  // Poll interval; 0 selects the agent's default.
  uint32 interval_ms = 3;
  // Do it as this guest user rather than as root: the guest kernel checks
  // the user may, and what is created is theirs. Empty is root. An agent that
  // honours this lists "files-as-user" in its health response.
  string user = 4;
}

message WatchEvent {
  // "created", "modified", or "deleted".
  string type = 1;
  string path = 2;
  bool is_dir = 3;
}

message FileChunk {
  // Set on the first message of an upload only.
  string path = 1;
  // Unix mode for a created file; 0 means 0644.
  uint32 mode = 2;
  bytes data = 3;
  // User to own the file and its created parents. Empty leaves them root's.
  string owner = 4;
  // Leave an existing file as it is instead of truncating it. The upload then
  // reports zero bytes written.
  bool is_existing_skipped = 5;
  // Do the write as this guest user rather than as root: the guest kernel
  // checks the user may, and a file it creates is theirs, so `owner` does
  // not go with it. An existing file keeps its mode. Empty is root.
  string user = 6;
}

message UploadResult {
  uint64 bytes_written = 1;
}

message DownloadRequest {
  string path = 1;
  // Do it as this guest user rather than as root: the guest kernel checks
  // the user may, and what is created is theirs. Empty is root. An agent that
  // honours this lists "files-as-user" in its health response.
  string user = 2;
}

message ListDirRequest {
  string path = 1;
  // Do it as this guest user rather than as root: the guest kernel checks
  // the user may, and what is created is theirs. Empty is root. An agent that
  // honours this lists "files-as-user" in its health response.
  string user = 2;
}

message DirEntry {
  string name = 1;
  bool is_dir = 2;
  uint64 size = 3;
  uint32 mode = 4;
}

message ListDirResponse {
  repeated DirEntry entries = 1;
}

message ExecInput {
  oneof input {
    ExecStart start = 1;
    bytes stdin = 2;
    ExecResize resize = 3;
    // Signal number to deliver to the process group.
    int32 signal = 4;
    // Close the child's stdin (EOF).
    bool is_stdin_eof = 5;
  }
}

message ExecStart {
  repeated string cmd = 1;
  map<string, string> env = 2;
  string cwd = 3;
  bool is_pty = 4;
  uint32 rows = 5;
  uint32 cols = 6;
  // User to run as. Empty is root, which is what every command was before
  // this field existed. HOME, USER, LOGNAME and the default cwd follow it.
  string user = 7;
  // Start from an empty environment instead of the agent's own, so the
  // command sees `env` plus the per-user variables and nothing else.
  bool is_env_cleared = 8;
  // Rotate this command's output log once a file reaches this many bytes,
  // as Docker's `max-size`. 0 keeps every byte in one file, unbounded, which
  // is the default.
  uint64 log_max_bytes = 9;
  // Log files kept once rotating, as Docker's `max-file`: the oldest is
  // dropped when there would be more, and an attach is told how many bytes
  // went with it. 0 means 1. Ignored without `log_max_bytes`.
  uint32 log_max_files = 10;
}

message ExecResize {
  uint32 rows = 1;
  uint32 cols = 2;
}

message ExecOutput {
  oneof output {
    bytes stdout = 1;
    bytes stderr = 2;
    int32 exit_code = 3;
    // Sent once, before any output, so a caller that means to come back to
    // this command has its id without waiting for it to finish.
    string command_id = 4;
    // Sent just before `exit_code` when a signal ended the command: which
    // one. `exit_code` is then 128 plus it, as a shell reports it. A command
    // ended by its own `kill` reports one just the same.
    int32 exit_signal = 5;
    // Sent on an attach in place of output it cannot have: how many bytes.
    // First, for output from before the requested offset that a rotating log
    // has since dropped. After the replay, for output a failed write never
    // recorded, most likely on a full disk, from which point on nothing was.
    uint64 lost_bytes = 6;
  }
}

message HandshakeRequest {
  // Entropy from the host for post-restore RNG reseed.
  bytes entropy = 1;
  // Host wall-clock, unix nanos, for post-restore clock fixup.
  int64 host_time_unix_nanos = 2;
  // True when this boot is a snapshot restore, not a cold boot.
  bool is_restored = 3;
  // Address this sandbox should use. A clone restored from a shared warm
  // snapshot wakes up holding the address that was baked into it, which
  // belongs to no one; the host is the only party that knows the right one.
  NetworkConfig network = 4;
  // PEM of the certificate authority this sandbox should trust, when it opted
  // in to having its TLS inspected. Empty otherwise, and an empty value must
  // not disturb a trust store the image shipped with.
  string inspection_ca_pem = 5;
  // Bundles this image's own environment points its tooling at, which the
  // well-known system paths do not cover. Empty unless the image named one.
  repeated TrustBundle extra_trust_bundles = 6;
  // Volumes to mount, in order. Sent on every handshake rather than only the
  // first: a resumed guest has the devices but not the mounts, since a mount
  // does not survive the VM it was made in.
  repeated VolumeMount volumes = 7;
}

// Deliberately not burrow.common.v1.VolumeMount: the guest protocol versions
// separately from the public API, and a paused sandbox resumes with the agent
// it was snapshotted with.
message VolumeMount {
  // Guest device the host attached this volume as, e.g. /dev/vdc.
  // Empty for a tmpfs mount.
  string device = 1;
  string path = 2;
  bool is_read_only = 3;
  bool is_tmpfs = 4;
  uint64 size_mib = 5;
  // Octal permissions for a freshly created mount root; empty keeps the
  // filesystem's default.
  string mode = 6;
}

// A trust store outside the system paths that the CA also has to reach.
message TrustBundle {
  // Absolute, and checked again in the guest: the value came from an image.
  string path = 1;
  // True only for a file of *additional* CAs, where nothing existing yet means
  // no extra CAs yet. A full bundle that is absent is a broken image
  // reference, and inventing one would leave every other root out of it.
  bool is_created_if_missing = 2;
}

message NetworkConfig {
  string ip = 1;
  uint32 prefix_len = 2;
  string gateway = 3;
  string dns = 4;
  // The same link's IPv6 address. Empty on a host that could not give the tap
  // one, in which case the guest has no v6 link and stays v4-only.
  string ip6 = 5;
  uint32 prefix_len6 = 6;
  // The v6 gateway, empty when the sandbox has no v6 link.
  string gateway6 = 7;
}

message HandshakeResponse {
  string agent_version = 1;

  // Where the guest's share of a warm create went, in microseconds. Purely
  // diagnostic: the host logs it at debug level so a slow create can be
  // attributed to a guest-side step rather than guessed at. A guest that does
  // not fill these in reports zeros, which read as "not measured".
  GuestResumeTiming timing = 2;
  // SHA-256 of the running agent binary, lowercase hex. The host compares it
  // with the binary it ships and upgrades a guest that differs.
  string agent_digest = 3;
}

message UpgradeChunk {
  bytes data = 1;
  // Expected SHA-256 of the whole binary, lowercase hex, on every chunk.
  string digest = 2;
}

message UpgradeResponse {
  // The binary was accepted and the agent is about to re-execute; the
  // connection will drop.
  bool is_restarting = 1;
}

// Guest-side costs of waking from a snapshot and handshaking, in microseconds.
message GuestResumeTiming {
  // Time the accepting task spent inside `accept()` before this connection
  // arrived, on the guest's monotonic clock, which does not advance while the
  // VM is paused.
  //
  // Read it as a difference, not an absolute: for the first connection after
  // a restore the interval *begins before the snapshot was taken*, so it
  // carries a fixed tail of whatever the guest was doing between re-entering
  // accept and being paused. That tail is identical for every sandbox
  // restored from one snapshot, so what moves between restores is guest wake.
  uint64 parked_us = 1;
  // Accept to the handshake handler running: the guest's HTTP/2 and gRPC
  // machinery.
  uint64 accept_to_call_us = 2;
  uint64 reseed_us = 3;
  uint64 clock_us = 4;
  uint64 trust_us = 5;
  uint64 network_us = 6;
  uint64 total_us = 7;

  // `trust_us` split three ways, summed over every bundle touched: reading
  // the existing store, searching it for a certificate already there, and
  // writing the replacement. A trust store is a few hundred kilobytes and the
  // certificate is under a kilobyte, so which of the three dominates is not
  // guessable. It was measured, and the answer decided what to fix.
  uint64 trust_read_us = 8;
  uint64 trust_scan_us = 9;
  uint64 trust_write_us = 10;
}

message GuestHealthRequest {}
message GuestHealthResponse {
  // What this agent does beyond the original protocol, so the host can tell
  // an agent that honours a newer field from an older one that would ignore
  // it. "files-as-user": the `user` fields on file transfers.
  // "attach-input": Attach, exit_signal and lost_bytes.
  // "output-feed": Feed, and command output kept on the host.
  repeated string features = 1;
}
