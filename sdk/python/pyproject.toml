[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pixec-burrow"
version = "0.1.0"
description = "Python SDK for burrow - run AI agent code in Firecracker microVMs"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["grpcio>=1.60", "protobuf>=4.25"]

[project.optional-dependencies]
dev = ["grpcio-tools>=1.60", "pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/burrow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
