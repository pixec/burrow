[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pixec-burrow"
version = "0.1.0"
description = "Python client for Burrow, sandboxes that run untrusted code in Firecracker microVMs"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.9"
# Floors match what the committed `_pb` modules were generated against:
# api_pb2_grpc.py refuses grpcio older than 1.80, and api_pb2.py validates
# the protobuf runtime at 6.31.1. Older wheels fail at import, not at use.
dependencies = ["grpcio>=1.80", "protobuf>=6.31"]

[project.optional-dependencies]
# Pinned to the minor that produced the committed `_pb`, so a regenerate
# does not silently move the runtime floors above.
dev = ["grpcio-tools~=1.80.0", "pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/burrow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
